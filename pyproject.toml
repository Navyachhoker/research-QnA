[tool.pytest.ini_options]
testpaths = ["tests"]
# Explicitly puts the repo root on sys.path for test collection. Without
# this, `pytest` (the standalone command, as opposed to `python -m pytest`)
# fails with "ModuleNotFoundError: No module named 'app'" on some setups,
# because tests/ has no __init__.py and pytest can't otherwise infer the
# repo root belongs on the import path.
pythonpath = ["."]
addopts = "-ra --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=75"
filterwarnings = [
    "ignore::DeprecationWarning:fitz",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "app/eval/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = ["app/eval"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]  # B008: Depends() in defaults is the correct FastAPI pattern

[tool.black]
line-length = 110
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
exclude = "^(app/eval/|tests/)"
