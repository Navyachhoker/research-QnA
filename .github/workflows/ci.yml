name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    env:
      GROQ_API_KEY: test-key-for-ci-only
      JWT_SECRET_KEY: test-secret-for-ci-only
      DATABASE_URL: sqlite:////tmp/ci_researchgpt.db
      CHROMA_PATH: /tmp/ci_chroma
      UPLOAD_DIR: /tmp/ci_uploads
      DATA_DIR: /tmp/ci_data

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch==2.3.1+cpu
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Format check (black)
        run: black --check app tests

      - name: Type check (mypy)
        run: mypy app

      - name: Test with coverage
        run: pytest tests/ -q

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
